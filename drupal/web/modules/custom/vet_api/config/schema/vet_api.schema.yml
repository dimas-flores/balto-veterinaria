vet_api.business:
  type: config_object
  label: 'Datos públicos de BALTO Veterinaria'
  mapping:
    name:
      type: label
      label: 'Nombre'
    slogan:
      type: label
      label: 'Lema'
    city:
      type: string
      label: 'Ciudad'
    currency:
      type: string
      label: 'Moneda'
    maps_cid:
      type: string
      label: 'Identificador de la ficha de Google Maps'
    addresses:
      type: sequence
      label: 'Sedes'
      sequence:
        type: string
    whatsapp:
      type: string
      label: 'WhatsApp'
    whatsapp_url:
      type: uri
      label: 'Enlace de WhatsApp'
    phone_secondary:
      type: string
      label: 'Segundo teléfono o vacío'
    instagram_user:
      type: string
      label: 'Usuario de Instagram sin @ o vacío'
    tiktok_name:
      type: string
      label: 'Nombre en TikTok o vacío'
    facebook_name:
      type: string
      label: 'Nombre de Facebook'
    facebook_url:
      type: string
      label: 'Enlace de Facebook o vacío'
    email:
      type: string
      label: 'Correo real o vacío'
    hospitalization:
      type: label
      label: 'Horario de hospitalización'
    consultation_schedule:
      type: text
      label: 'Horario de tienda y consultorio'
    schedule_is_example:
      type: boolean
      label: 'Horario de ejemplo'
    payment_methods:
      type: string
      label: 'Medios de pago del local'
    yape_number:
      type: string
      label: 'Número de Yape'
    service_pricing_note:
      type: text
      label: 'Información de precios de servicios'
    catalog_is_example:
      type: boolean
      label: 'Inventario de ejemplo'
    privacy_policy:
      type: text
      label: 'Política de privacidad aprobada'
    purchase_terms:
      type: text
      label: 'Condiciones de compra aprobadas'
    complaints_book_url:
      type: uri
      label: 'Enlace al Libro de Reclamaciones'
    about_title:
      type: label
      label: 'Título de presentación'
    about_text:
      type: text
      label: 'Presentación'

